<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #fff;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <canvas id="canvasRobo" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("canvasRobo");
        const ctx = canvas.getContext("2d");

        function desenharRobo(tempo) {
            // Limpa a tela a cada frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. MOVIMENTO GERAL DO ROBÔ (Deslocamento horizontal usando seno)
            const deslocamentoX = canvas.width / 2 + Math.sin(tempo * 0.002) * 150;
            const deslocamentoY = canvas.height / 2;

            ctx.save(); // Salva o estado global
            ctx.translate(deslocamentoX, deslocamentoY); // Move todo o sistema de coordenadas

            // --- CORPO ---
            ctx.fillStyle = "#0055aa";
            ctx.fillRect(-40, -50, 80, 100); 

            // --- CABEÇA ---
            // Fixa em relação ao corpo, mas faz um leve movimento de "bobbing" (sobe e desce)
            ctx.save();
            ctx.translate(0, -50 + Math.sin(tempo * 0.01) * 5); 
            ctx.fillStyle = "#aaaaaa";
            ctx.fillRect(-25, -40, 50, 40);
            
            // Olhos
            ctx.fillStyle = "#00ffff";
            ctx.fillRect(-15, -30, 10, 10);
            ctx.fillRect(5, -30, 10, 10);
            ctx.restore();

            // 2. MOVIMENTO DO BRAÇO ESQUERDO (Rotação independente)
            ctx.save();
            ctx.translate(-40, -40); // Ponto de articulação (ombro)
            ctx.rotate(Math.sin(tempo * 0.005) * 1.5); // Rotaciona para frente e para trás
            ctx.fillStyle = "#777777";
            ctx.fillRect(-20, 0, 20, 70);
            ctx.restore();

            // 3. MOVIMENTO DO BRAÇO DIREITO (Rotação invertida em relação ao esquerdo)
            ctx.save();
            ctx.translate(40, -40); // Ponto de articulação (ombro)
            ctx.rotate(Math.sin(tempo * 0.005 + Math.PI) * 1.5); // Math.PI inverte a fase do movimento
            ctx.fillStyle = "#777777";
            ctx.fillRect(0, 0, 20, 70);
            ctx.restore();

            // 4. MOVIMENTO DA PERNA ESQUERDA (Movimento oposto ao braço esquerdo)
            ctx.save();
            ctx.translate(-20, 50); // Ponto de articulação (quadril)
            ctx.rotate(Math.sin(tempo * 0.005 + Math.PI) * 1.2); 
            ctx.fillStyle = "#444444";
            ctx.fillRect(-15, 0, 30, 80);
            ctx.restore();

            // 5. MOVIMENTO DA PERNA DIREITA (Movimento oposto ao braço direito)
            ctx.save();
            ctx.translate(20, 50); // Ponto de articulação (quadril)
            ctx.rotate(Math.sin(tempo * 0.005) * 1.2); 
            ctx.fillStyle = "#444444";
            ctx.fillRect(-15, 0, 30, 80);
            ctx.restore();

            ctx.restore(); // Restaura o estado global (fim da montagem do robô)

            // Loop de animação
            requestAnimationFrame(desenharRobo);
        }

        // Inicia a animação
        requestAnimationFrame(desenharRobo);
    </script>

</body>
</html>
